%YAML 1.1
---
# mtk-seninf has no hardware converter. Debayer with the GLES ISP.
# If the surfaceless context cannot be created, libcamera stays on the CPU.
version: 1
configuration:
  pipelines:
    simple:
      supported_devices:
        - driver: mtk-seninf
          software_isp: true
  software_isp:
    mode: gpu
